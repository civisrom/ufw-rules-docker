# =============================================
# IP Configuration for UFW Docker Rules
# ==============================================
# Этот файл определяет источники IP адресов для UFW скриптов
#
# ⚠️ ВАЖНО: Все IP адреса извлекаются из MaxMind GeoLite2 баз данных
# Требуется бесплатный License Key от MaxMind: https://www.maxmind.com/en/geolite2/signup
# Добавьте MAXMIND_LICENSE_KEY в GitHub Secrets или в переменные среды
#
# MaxMind GeoLite2 базы данных:
# - GeoLite2-Country: IP адреса по странам (ISO коды)
# - GeoLite2-City: IP адреса по городам
# - GeoLite2-ASN: IP адреса по ASN (провайдеры, облака)
#
# СТРУКТУРА v3.1:
# - Два независимых скрипта: ufw_v4_script и ufw_v6_script
# - Каждый скрипт содержит и IPv4 и IPv6 адреса
# - Возможность указать разные ASN/страны/города для каждого скрипта
# ============================================

version: "3.1"

# ============================================
# НАСТРОЙКИ ГЕНЕРАЦИИ
# ============================================
generation:
  # Какие скрипты обновлять:
  # v4 - только ufw-docker-rules-v4.sh
  # v6 - только ufw-docker-rules-v6.sh
  # both - оба скрипта (рекомендуется)
  update_scripts: "both"

  # Глобальное включение/отключение IPv6
  # Если false, все ipv6 секции будут игнорироваться
  ipv6_enabled: true

# ============================================
# UFW-DOCKER-RULES-V4.SH
# Настройки для первого скрипта
# ============================================
ufw_v4_script:
  # SSH_ALLOWED_IPS для v4 скрипта
  ssh_allowed_ips:
    # ========== IPv4 адреса ==========
    ipv4:
      direct_ips:
        #- "192.168.1.0/24"
      asn:
        - "AS48004"
        #- "AS13335"  # Cloudflare
      countries:
        # - "RU"
      cities:
        # - "RU/Moscow"

    # ========== IPv6 адреса ==========
    ipv6:
      enabled: true  # Включить IPv6 для этого списка
      direct_ips:
        #- "2001:db8::/32"
      asn:
        - "AS48004"
      countries:
        # - "RU"
      cities:
        # - "RU/Moscow"

  # DOCKER_ALLOWED_IPS для v4 скрипта
  docker_allowed_ips:
    ipv4:
      direct_ips:
        #- "192.168.1.0/24"
      asn:
        - "AS48004"
        - "AS201776"
        - "AS48000"
        - "AS8359"
        - "AS29194"
        - "AS203451"
        - "AS203561"
      countries:
        # - "US"
      cities:
        # - "US/Virginia/Ashburn"

    ipv6:
      enabled: true
      direct_ips:
        #- "2001:db8::/32"
      asn:
        - "AS48004"
        - "AS201776"
        - "AS48000"
        - "AS8359"
        - "AS29194"
        - "AS203451"
        - "AS203561"
      countries:
        # - "US"
      cities:
        # - "US/Virginia/Ashburn"

  # RUSTDESK_ALLOWED_IPS для v4 скрипта
  rustdesk_allowed_ips:
    ipv4:
      direct_ips:
        #- "192.168.1.0/24"
      asn:
        #- "AS13335"
      countries:
        # - "RU"
      cities:
        # - "RU/Moscow"

    ipv6:
      enabled: false  # Отключить IPv6 для RustDesk в v4 скрипте
      direct_ips:
        #- "2001:db8::/32"
      asn:
        #- "AS13335"
      countries:
        # - "RU"
      cities:
        # - "RU/Moscow"

