# ============================================
# НАСТРОЙКИ ГЕНЕРАЦИИ
# ============================================
settings:
  # ⚠️ ОБЯЗАТЕЛЬНО: MaxMind License Key
  # Получите БЕСПЛАТНЫЙ ключ на https://www.maxmind.com/en/geolite2/signup
  #
  # Для локального использования:
  #   export MAXMIND_LICENSE_KEY="your_key_here"
  #   ./generate-ips.sh
  #
  # Для GitHub Actions:
  #   1. Перейдите в Settings → Secrets and variables → Actions
  #   2. Создайте секрет: MAXMIND_LICENSE_KEY
  #   3. Вставьте ваш ключ
  #
  # Без этого ключа система НЕ БУДЕТ РАБОТАТЬ!
  maxmind_license_key: "${MAXMIND_LICENSE_KEY}"

  # Использовать кеш GeoIP баз (ускоряет генерацию)
  # CSV базы кешируются на 7 дней
  use_geoip_cache: true

  # Максимальное количество IP адресов для одного списка
  # Защита от случайного добавления слишком большого количества адресов
  max_ips_per_list: 10000

  # Оптимизация: объединять соседние CIDR блоки
  # MaxMind базы содержат множество мелких блоков, оптимизация обязательна
  optimize_cidrs: true

  # Дедупликация: удалять дубликаты
  deduplicate: true

  # MaxMind GeoLite2 базы данных (основной источник)
  # Автоматически скачиваются в формате CSV
  maxmind_databases:
    country: "GeoLite2-Country-CSV"
    city: "GeoLite2-City-CSV"
    asn: "GeoLite2-ASN-CSV"

